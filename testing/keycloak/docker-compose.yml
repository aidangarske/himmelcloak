services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:latest}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-test-only
      KC_HOSTNAME: https://keycloak.test:8443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/server.key
      KC_HTTP_ENABLED: "false"
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL: info
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./.generated/server.crt:/opt/keycloak/certs/server.crt:ro
      - ./.generated/server.key:/opt/keycloak/certs/server.key:ro
    networks:
      default:
        aliases:
          - keycloak.test

  tester:
    image: himmelcloak-tester:ci
    build:
      context: ../..
      dockerfile: testing/build/Dockerfile
    environment:
      KEYCLOAK_URL: https://keycloak.test:8443
      KEYCLOAK_CA: /work/testing/keycloak/.generated/ca.pem
      CARGO_HOME: /tmp/himmelcloak-cargo
      CARGO_TARGET_DIR: /tmp/himmelcloak-target
    volumes:
      - ../..:/work
      - cargo-target:/tmp/himmelcloak-target
    working_dir: /work
    depends_on:
      - keycloak
    entrypoint: ["/work/testing/keycloak/wait-and-test.sh"]
    command: ["cargo", "test", "--locked", "--test", "live_keycloak", "--", "--ignored"]

volumes:
  cargo-target:
