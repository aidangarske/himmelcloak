# himmelcloak workspace. Native, no-browser Keycloak authentication for Linux.
# See docs/README.md.
[workspace]
resolver = "2"
members = ["crates/himmelcloak"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "LGPL-3.0-or-later OR GPL-3.0-or-later"
authors = ["Aidan Garske <aidan@wolfssl.com>"]
repository = "https://github.com/aidangarske/himmelcloak"

# Enforced by `cargo clippy` in CI (not by `cargo build`).
[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
