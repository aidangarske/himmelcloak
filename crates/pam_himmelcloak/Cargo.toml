[package]
name = "pam_himmelcloak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PAM module for native Keycloak login, installed as pam_himmelcloak.so."
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
# Test-only: pam_sm_authenticate runs a conversation round trip and still denies.
# It has no effect in release builds. Used by the disposable PAM stack test.
conversation-selftest = []

[dependencies]
himmelcloak = { path = "../.." }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
zeroize = "1"
