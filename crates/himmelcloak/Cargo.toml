[package]
name = "himmelcloak"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native, no-browser Keycloak authentication for Linux (sister to libhimmelblau / okta-auth-rs)."

[lints]
workspace = true

[features]
# Default: phishing-resistant core. Hardware (TPM/HSM) and COSE are additive and off by default.
default = ["password", "totp", "webauthn", "webauthn-usb"]

# --- auth methods (each independently compile-out-able) ---
password = []
totp = []
sms = []
email = []
recovery = []
webauthn = []
x509 = []
required-actions = []
device-flow = []

# --- webauthn transports / authenticator kinds (sub-features of webauthn) ---
webauthn-usb = ["webauthn"]
webauthn-platform = ["webauthn"]
webauthn-nfc = ["webauthn"]
webauthn-ble = ["webauthn"]
webauthn-virtual = ["webauthn"]

# crypto and tls placeholders until the wolf crates are
#     wired, real optional deps get added then
crypto-wolfcrypt = []
tls-wolfssl = []

# --- hardware key custody (off by default) ---
hsm-seal = []
hw-wolftpm = []
hw-wolfhsm = []
tpm-simulator = []

# --- optional COSE ---
cose-wolfcose = []

# --- convenience bundles ---
full = ["password","totp","sms","email","recovery","webauthn","webauthn-usb","webauthn-platform","webauthn-nfc","webauthn-ble","x509","required-actions","device-flow","hsm-seal","hw-wolftpm","hw-wolfhsm","cose-wolfcose"]
gov = ["x509","webauthn","webauthn-usb","webauthn-platform","totp","recovery","hsm-seal","hw-wolftpm"]
passwordless = ["webauthn","webauthn-usb","x509","recovery"]

[dependencies]
# Intentionally EMPTY for the skeleton so `cargo build` is green with no system libs.
# Real deps are added additively as features land: wolfcrypt-rs / wolfssl,
# rustls + rustls-wolfcrypt-provider, wolftpm (PR #602), an HTTP client, serde, etc.
