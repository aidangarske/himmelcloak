name: wolfSSL Version Matrix

# Auto dependency test. Builds wolfSSL at latest -stable and at master (resolved at run time) and
# builds + tests himmelcloak against each, so upstream wolfSSL drift is caught here, not by a user.
on:
  push:
    branches: ['main', 'release/**']
  pull_request:
    branches: ['*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, catches master drift even without a PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/_resolve-wolfssl.yml

  test:
    name: wolfSSL ${{ matrix.wolfssl-version }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      # Cache stable only. master must always rebuild to catch regressions.
      - name: Cache wolfSSL (${{ matrix.wolfssl-version }})
        if: matrix.wolfssl-version != 'master'
        id: cache-wolfssl
        uses: actions/cache@v4
        with:
          path: ~/wolfssl-install
          key: wolfssl-${{ matrix.wolfssl-version }}-v1

      - name: Build wolfSSL (${{ matrix.wolfssl-version }})
        if: matrix.wolfssl-version == 'master' || steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: |
          cd ~
          git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} https://github.com/wolfSSL/wolfssl.git
          cd wolfssl
          ./autogen.sh
          ./configure --enable-all --prefix=$HOME/wolfssl-install
          make -j"$(nproc)"
          make install

      - name: Build + test himmelcloak against wolfSSL ${{ matrix.wolfssl-version }}
        run: |
          export WOLFSSL_DIR=$HOME/wolfssl-install
          export LD_LIBRARY_PATH=$WOLFSSL_DIR/lib
          # himmelcloak links wolfSSL / wolfCrypt once the crypto layer is wired (see
          # docs Crypto-and-Hardware). Pass the wolf features + WOLFSSL_DIR here as they land.
          cargo build --workspace --all-features
          cargo test --workspace

      - name: wolfSSL version info
        if: always()
        run: |
          if [ -f "$HOME/wolfssl-install/include/wolfssl/version.h" ]; then
            grep LIBWOLFSSL_VERSION_STRING "$HOME/wolfssl-install/include/wolfssl/version.h" || true
          fi
