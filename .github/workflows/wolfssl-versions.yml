name: wolfSSL and curl compatibility

# Keep the fixed baseline reproducible while detecting upstream drift in
# wolfSSL and curl without manually updating version strings.
on:
  push:
    branches: ['main', 'core', 'release/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: native-versions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/_resolve-wolfssl.yml

  test:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: testing/build/Dockerfile
          load: true
          tags: himmelcloak-tester:ci
          build-args: |
            WOLFSSL_REF=${{ matrix.wolfssl-ref }}
            WOLFSSL_COMMIT=${{ matrix.wolfssl-commit }}
            CURL_REF=${{ matrix.curl-ref }}
            CURL_COMMIT=${{ matrix.curl-commit }}
      - name: Show resolved versions
        run: |
          docker run --rm himmelcloak-tester:ci cat /opt/himmelcloak-native/.himmelcloak-refs
          docker run --rm himmelcloak-tester:ci sh -c 'grep LIBWOLFSSL_VERSION_STRING /opt/himmelcloak-native/include/wolfssl/version.h; /opt/himmelcloak-native/bin/curl-config --version; /opt/himmelcloak-native/bin/curl-config --ssl-backends'
      - name: Build all features and run unit tests
        run: |
          docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci cargo build --locked --all-features
          docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci cargo test --locked --lib
