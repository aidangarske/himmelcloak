name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: testing/build/Dockerfile
          load: true
          tags: himmelcloak-tester:ci
          cache-from: type=gha,scope=himmelcloak-native
          cache-to: type=gha,mode=max,scope=himmelcloak-native
      - name: Format
        run: docker run --rm -v "$PWD:/work" -w /work himmelcloak-tester:ci cargo fmt --all --check
      - name: Clippy
        run: docker run --rm -v "$PWD:/work" -w /work himmelcloak-tester:ci cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: docker run --rm -v "$PWD:/work" -w /work himmelcloak-tester:ci cargo test --locked --workspace --lib
