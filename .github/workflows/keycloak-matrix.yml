name: Keycloak login tests
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    uses: ./.github/workflows/_resolve-keycloak.yml

  login:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      KEYCLOAK_IMAGE: ${{ matrix.keycloak-image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: testing/build/Dockerfile
          load: true
          tags: himmelcloak-tester:ci
          cache-from: type=gha,scope=himmelcloak-native
          cache-to: type=gha,mode=max,scope=himmelcloak-native
      - name: Generate test certificate
        run: testing/keycloak/bootstrap-cert.sh
      - name: Start stock Keycloak
        run: docker compose -f testing/keycloak/docker-compose.yml up -d keycloak
      - name: Record server image
        run: |
          echo "Keycloak image channel: ${{ matrix.keycloak-ref }}"
          echo "Keycloak main HEAD at resolution: ${{ matrix.keycloak-main-head }}"
          docker image inspect "$KEYCLOAK_IMAGE" --format '{{index .RepoDigests 0}}'
      - name: Run live login suite
        run: |
          docker compose -f testing/keycloak/docker-compose.yml run --rm \
            -e HIMMELCLOAK_TEST_VERBOSE=1 tester \
            cargo test --locked --test live_keycloak -- --ignored --nocapture
      - name: Show Keycloak authentication events
        if: always()
        run: |
          docker compose -f testing/keycloak/docker-compose.yml logs --no-color keycloak \
            | awk -f testing/keycloak/auth-events.awk
      - name: Keycloak logs on failure
        if: failure()
        run: docker compose -f testing/keycloak/docker-compose.yml logs --no-color keycloak
      - name: Stop Keycloak
        if: always()
        run: docker compose -f testing/keycloak/docker-compose.yml down -v
