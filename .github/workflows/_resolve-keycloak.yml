name: Resolve Keycloak images

# The stable release comes from Keycloak's numeric release tags. Its official
# nightly image is the development build; both images are pinned by digest for
# the duration of a CI run.
on:
  workflow_call:
    outputs:
      matrix:
        description: 'Stable and nightly Keycloak images resolved by digest'
        value: ${{ jobs.resolve.outputs.matrix }}
      latest-stable:
        description: 'Latest stable Keycloak source tag'
        value: ${{ jobs.resolve.outputs.latest-stable }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      latest-stable: ${{ steps.set.outputs.latest-stable }}
    steps:
      - name: Resolve stable tag, development ref, and image digests
        id: set
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/keycloak/keycloak.git '[0-9]*' \
            | awk -F/ '{print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ -z "${TAG:-}" ]; then
            echo '::error::Could not resolve a stable Keycloak release tag'
            exit 1
          fi
          MAIN_SHA=$(git ls-remote --heads https://github.com/keycloak/keycloak.git main | awk '{print $1}')
          if [ -z "${MAIN_SHA:-}" ]; then
            echo '::error::Could not resolve Keycloak main'
            exit 1
          fi
          STABLE_IMAGE="quay.io/keycloak/keycloak:$TAG"
          NIGHTLY_IMAGE='quay.io/keycloak/keycloak:nightly'
          docker pull "$STABLE_IMAGE"
          docker pull "$NIGHTLY_IMAGE"
          STABLE_DIGEST=$(docker image inspect "$STABLE_IMAGE" --format '{{index .RepoDigests 0}}')
          NIGHTLY_DIGEST=$(docker image inspect "$NIGHTLY_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "Stable Keycloak: $TAG ($STABLE_DIGEST)"
          echo "Keycloak main HEAD at resolution: $MAIN_SHA"
          echo "Keycloak nightly image: $NIGHTLY_DIGEST"
          echo "latest-stable=$TAG" >> "$GITHUB_OUTPUT"
          MATRIX=$(jq -nc --arg tag "$TAG" --arg main "$MAIN_SHA" \
            --arg stable "$STABLE_DIGEST" --arg nightly "$NIGHTLY_DIGEST" '{
              include: [
                {"name":("stable " + $tag),"keycloak-ref":$tag,"keycloak-image":$stable},
                {"name":"nightly (development)","keycloak-ref":"nightly","keycloak-main-head":$main,"keycloak-image":$nightly}
              ]
            }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
