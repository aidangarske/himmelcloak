version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # wolfssl-wolfcrypt implements the signature 2.x traits; move with it, not ahead of it.
      - dependency-name: signature
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
